pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{js,mjs,cjs,ts,svelte,json,css,md,yaml,yml}"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,mjs,cjs,ts,svelte}"
      run: npx eslint {staged_files}

pre-push:
  parallel: true
  commands:
    check:
      run: npm run check
    test:
      run: npm run test
